<!-- ============================================================================
     CozyThreads — Login page
     Paste into:  Customize → Pages → Login page
     The credential fields + submit are rendered by Freshdesk inside {{form}}.
     ========================================================================= -->
<section class="ct-section">
  <div class="ct-container">

    <div style="text-align:center;margin-bottom:28px;">
      <span class="ct-eyebrow">Welcome back</span>
      <h1 class="ct-h" style="font-size:2rem;margin:0 0 6px;">Sign in to your account</h1>
      <p style="color:var(--ct-muted);">Track your requests and pick up where you left off.</p>
    </div>

    <div class="ct-form-wrap" style="max-width:440px;">
      <!-- FRESHDESK: login form (email, password, remember-me, submit, SSO) -->
      {{form}}

      <p style="text-align:center;margin:18px 0 0;color:var(--ct-muted);font-size:0.92rem;">
        New here? <a href="/support/signup">Create an account</a>
      </p>
    </div>

  </div>
</section>

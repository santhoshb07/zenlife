<!-- ============================================================================
     CozyThreads — Folder page (lists articles inside a folder)
     Paste into:  Customize → Pages → Folder page
     ========================================================================= -->
<section class="ct-section">
  <div class="ct-container">

    <ul class="ct-breadcrumb">
      <li><a href="/support/home">Help Center</a></li>
      <li><a href="{{folder.category.url}}">{{folder.category.name}}</a></li>
      <li>{{folder.name}}</li>
    </ul>

    <span class="ct-eyebrow">Articles</span>
    <h1 class="ct-h" style="font-size:2.2rem;margin:0 0 24px;">{{folder.name}}</h1>

    <div class="ct-table-wrap" style="padding:8px 18px;">
      <ul class="ct-article-list">
        {% for article in folder.articles %}
          <li>
            <a href="{{article.url}}">
              <span class="ct-doc-icon">📄</span>
              <span>{{article.title}}</span>
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>

  </div>
</section>

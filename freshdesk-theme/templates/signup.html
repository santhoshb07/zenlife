<!-- ============================================================================
     CozyThreads — Sign up page
     Paste into:  Customize → Pages → Sign up page
     ========================================================================= -->
<section class="ct-section">
  <div class="ct-container">

    <div style="text-align:center;margin-bottom:28px;">
      <span class="ct-eyebrow">Join CozyThreads</span>
      <h1 class="ct-h" style="font-size:2rem;margin:0 0 6px;">Create your account</h1>
      <p style="color:var(--ct-muted);">It only takes a minute — then you can track every request in one place.</p>
    </div>

    <div class="ct-form-wrap" style="max-width:440px;">
      <!-- FRESHDESK: signup form (name, email, captcha, submit) -->
      {{form}}

      <p style="text-align:center;margin:18px 0 0;color:var(--ct-muted);font-size:0.92rem;">
        Already have an account? <a href="/support/login">Sign in</a>
      </p>
    </div>

  </div>
</section>

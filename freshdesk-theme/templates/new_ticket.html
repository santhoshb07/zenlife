<!-- ============================================================================
     CozyThreads — New ticket page (Contact / Submit a request)
     Paste into:  Customize → Pages → New ticket page
     The actual form fields are rendered by Freshdesk inside {{form}}.
     ========================================================================= -->
<section class="ct-section">
  <div class="ct-container">

    <ul class="ct-breadcrumb">
      <li><a href="/support/home">Help Center</a></li>
      <li>Contact us</li>
    </ul>

    <div style="text-align:center;margin-bottom:32px;">
      <span class="ct-eyebrow">We're here to help</span>
      <h1 class="ct-h" style="font-size:2.2rem;margin:0 0 8px;">Submit a request</h1>
      <p style="color:var(--ct-muted);max-width:560px;margin:0 auto;">
        Tell us what's going on — order issues, returns, sizing, anything.
        Our team usually replies within one business day.
      </p>
    </div>

    <div class="ct-form-wrap">
      <!-- FRESHDESK: the ticket form (subject, description, custom fields,
           attachments, captcha, submit button) is injected here. -->
      {{form}}
    </div>

  </div>
</section>
